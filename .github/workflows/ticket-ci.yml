name: Ticket Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/ticket/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/ticket/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ticket/Ticket.Api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build Docker image
        run: docker build -t ticket-service .