name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Build Docker image
        run: docker build -t ithelpdeskacr01.azurecr.io/frontend:${{ github.sha }} .

      - name: Log in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          az acr login --name ithelpdeskacr01
          docker push ithelpdeskacr01.azurecr.io/frontend:${{ github.sha }}

      - name: Deploy to Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: az containerapp update --name it-helpdesk-frontend --resource-group it-helpdesk-rg --image ithelpdeskacr01.azurecr.io/frontend:${{ github.sha }}