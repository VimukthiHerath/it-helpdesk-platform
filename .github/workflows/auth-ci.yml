name: Auth Service CI/CD

# The steps live in backend-service.yml; this file only says what is specific to this service.

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/auth/**'
      - '.github/workflows/auth-ci.yml'
      - '.github/workflows/backend-service.yml'
      - '.github/actions/deploy-container-app/**'
      - '.github/scripts/test-summary.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/auth/**'
      - '.github/workflows/auth-ci.yml'
      - '.github/workflows/backend-service.yml'
      - '.github/actions/deploy-container-app/**'
      - '.github/scripts/test-summary.py'

permissions:
  id-token: write
  contents: read

# A newer push to a pull request replaces the older run; runs on develop are never cancelled.
concurrency:
  group: auth-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/backend-service.yml
    with:
      service: auth
      project-dir: services/auth/Auth.Api
      project-name: Auth.Api
      container-app: auth-service
      db-name: auth_db
      db-env-var: ConnectionStrings__AuthDb
    secrets:
      AZURE_NEW_CLIENT_ID: ${{ secrets.AZURE_NEW_CLIENT_ID }}
      AZURE_NEW_TENANT_ID: ${{ secrets.AZURE_NEW_TENANT_ID }}
      AZURE_NEW_SUBSCRIPTION_ID: ${{ secrets.AZURE_NEW_SUBSCRIPTION_ID }}
      DB_CONNECTION_STRING: ${{ secrets.AUTH_DB_CONNECTION_STRING }}
