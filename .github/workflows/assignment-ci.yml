name: Assignment Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/assignment/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/assignment/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assignment/Assignment.Api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build Docker image
        run: docker build -t ithelpdeskacr01.azurecr.io/assignment-service:${{ github.sha }} .

      - name: Log in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          az acr login --name ithelpdeskacr01
          docker push ithelpdeskacr01.azurecr.io/assignment-service:${{ github.sha }}

      - name: Deploy to Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: az containerapp update --name assignment-service --resource-group it-helpdesk-rg --image ithelpdeskacr01.azurecr.io/assignment-service:${{ github.sha }}