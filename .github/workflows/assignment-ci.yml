name: Assignment Service CI/CD

# The steps live in backend-service.yml; this file only says what is specific to this service.

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/assignment/**'
      - '.github/workflows/assignment-ci.yml'
      - '.github/workflows/backend-service.yml'
      - '.github/actions/deploy-container-app/**'
      - '.github/scripts/test-summary.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/assignment/**'
      - '.github/workflows/assignment-ci.yml'
      - '.github/workflows/backend-service.yml'
      - '.github/actions/deploy-container-app/**'
      - '.github/scripts/test-summary.py'

permissions:
  id-token: write
  contents: read

# A newer push to a pull request replaces the older run; runs on develop are never cancelled.
concurrency:
  group: assignment-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/backend-service.yml
    with:
      service: assignment
      project-dir: services/assignment/Assignment.Api
      project-name: Assignment.Api
      container-app: assignment-service
      db-name: assignment_db
      db-env-var: ConnectionStrings__AssignmentDb
      test-filter: 'Category!=Integration'
    secrets:
      AZURE_NEW_CLIENT_ID: ${{ secrets.AZURE_NEW_CLIENT_ID }}
      AZURE_NEW_TENANT_ID: ${{ secrets.AZURE_NEW_TENANT_ID }}
      AZURE_NEW_SUBSCRIPTION_ID: ${{ secrets.AZURE_NEW_SUBSCRIPTION_ID }}
      DB_CONNECTION_STRING: ${{ secrets.ASSIGNMENT_DB_CONNECTION_STRING }}
